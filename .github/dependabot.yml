version: 2

# THIS FILE WAS ABSENT, AND THAT IS WHY A STALE RED PERSISTED. Dependabot ran here
# anyway -- security updates need no config -- so the repository received
# automated updates nobody had configured. One failed on 18-19 August (`uv in
# /. for sqlparse`, a resolver conflict) and, with no version-update schedule,
# that failure stayed the workflow's last word. The underlying problem is
# already gone: sqlparse here is 0.6.0 and there are zero open alerts. Nothing
# was left to fix except the absence of a later run.
#
# Declaring the ecosystems does two things: updates arrive grouped and weekly
# instead of one PR per transitive package, and a resolution failure shows up
# again the following week rather than staying the last word.
updates:
  # Python, uv-managed: one lockfile at the root. Dependabot reads
  # pyproject.toml and uv.lock together.
  #
  # GROUPED, because this lock is nearly all transitive dbt and Airflow
  # dependencies. Ungrouped it opens a PR per package and the one bump that
  # matters is indistinguishable from forty that do not.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ['*']
    ignore:
      # pyarrow is held below 25 by databricks-connect, not by us.
      # `databricks-connect==19.1` requires `pyarrow<25,>=11.0.0`, so the bump
      # Dependabot keeps proposing, 23.0.1 -> 25.0.1, cannot resolve while the
      # `engine` group exists. That is what has failed this repository's `uv`
      # job every run since 19 August:
      #
      #   Because databricks-connect>=19.1 depends on pyarrow==25.0.1
      #   and ...:engine depends on databricks-connect==19.1 ...
      #   we can conclude that ...:engine cannot be used.
      #
      # Held rather than worked around. Widening our own `pyarrow>=18,<24` to
      # admit 25 does not help: the constraint that refuses it belongs to
      # databricks-connect, and the resolution fails either way. Minor and
      # patch updates keep flowing.
      #
      # LIFT THIS when databricks-connect admits pyarrow 25. The tell is its
      # `requires_dist` on PyPI, `pyarrow<25,>=11.0.0` today, growing a higher
      # ceiling. Worth checking at the same time: 19.1 declares
      # `requires_python = "==3.12.*"`, so it is also what confines this
      # repository to 3.12 in practice.
      - dependency-name: pyarrow
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
