# Every value from the environment. The same file points at the emulator
# or a real workspace depending only on what the caller exports.
contoso_gold:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: gold
      threads: 1
      connect_retries: 1
      connect_timeout: 20
      connection_parameters:
        _connection_uri: "{{ env_var('DATABRICKS_CONNECTION_URI') }}"
        use_cloud_fetch: false
        enable_telemetry: false
